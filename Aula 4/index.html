<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="container">
    <h1>Lista de Tarefas</h1>
    <p>Adicione suas tarefas!</p>
    <input type="text" id="tarefa" placeholder="Digite sua tarefa">

    <ul id="lista_tarefas"></ul>
    
    <button onclick="adicionar_tarefa()">Adicionar Tarefa</button>
    <button onclick="mostrar_tarefas()">Mostrar tarefas</button>
    <p id="mensagem"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
