<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Página inicial</title>
</head>

<body>
    <div class="container">
        <h1>Boas vindas!</h1>
        <p>Vamos personalizar sua saudação usando JavaScript!</p>
        <div class="saudacao" id="mensagem_saudacao">Olá, visitante!</div>
        <button onClick="mudar_nome()">Personalizar saudação</button>
    </div>

    <script>
        function mudar_nome() {
            let nome = "Guilherme"
            document.getElementById("mensagem_saudacao").textContent = "Olá, " + nome + "!"
        }
    </script>
</body>

</html>
